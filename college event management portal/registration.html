<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">College Events</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link active" href="registration.html">Registration</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Header -->
<section class="bg-success text-white text-center py-5">
    <div class="container">
        <h1>Event Registration</h1>
        <p>Register for your favorite college event.</p>
    </div>
</section>

<!-- Registration Form -->
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Success Message -->
            <div id="successAlert" class="alert alert-success d-none" role="alert">
                Registration Successful! Thank you for registering.
            </div>

            <div class="card shadow">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Registration Form</h3>

                    <form id="registrationForm">

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Branch</label>
                            <select class="form-select" required>
                                <option value="">Select Branch</option>
                                <option>CSE</option>
                                <option>CSM</option>
                                <option>ECE</option>
                                <option>EEE</option>
                                <option>Mechanical</option>
                                <option>Civil</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select Event</label>
                            <select class="form-select" required>
                                <option value="">Choose Event</option>
                                <option>Technical Quiz</option>
                                <option>Hackathon</option>
                                <option>Poster Presentation</option>
                                <option>Coding Contest</option>
                                <option>Project Expo</option>
                                <option>Cultural Fest</option>
                            </select>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success px-4">
                                Register
                            </button>
                            <button type="reset" class="btn btn-secondary px-4 ms-2">
                                Reset
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">
        © 2026 College Event Management System | All Rights Reserved
    </p>
</footer>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(e) {
    e.preventDefault();

    document.getElementById("successAlert").classList.remove("d-none");

    this.reset();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
