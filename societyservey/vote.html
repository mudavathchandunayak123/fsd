<!DOCTYPE html>
<html>
<head>
    <title>Vote</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>President Election</h1>

    <form>

        <div class="cards">

            <div class="card">

                <h3>Rahul Sharma</h3>

                <p>Flat: A-101</p>

                <p>Position: President</p>

                <p>Manifesto: Improve cleanliness and security.</p>

                <input type="radio" name="vote">

            </div>

            <div class="card">

                <h3>Priya Reddy</h3>

                <p>Flat: B-204</p>

                <p>Position: President</p>

                <p>Manifesto: Better maintenance and parking.</p>

                <input type="radio" name="vote">

            </div>

        </div>

        <br>

        <button type="submit">Submit Vote</button>

    </form>

</div>

</body>
</html>
