<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survey Page</title>

<link rel="stylesheet" href="style.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    padding:18px 8%;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:700;
}

nav ul{
    display:flex;
    gap:25px;
    list-style:none;
}

nav ul li a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

nav ul li a:hover{
    color:#dbeafe;
}

/* HERO */

.hero{
    text-align:center;
    padding:70px 20px;
    background:linear-gradient(rgba(30,58,138,0.75),
    rgba(37,99,235,0.75)),
    url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=1200') center/cover;
    color:white;
}

.hero h1{
    font-size:50px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
}

/* SURVEY FORM */

.survey-container{
    width:90%;
    max-width:700px;
    margin:60px auto;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.survey-container h2{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:30px;
}

form{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    color:#1e3a8a;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    transition:0.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 8px rgba(37,99,235,0.3);
}

textarea{
    resize:none;
    height:120px;
}

.checkbox-group{
    margin-bottom:20px;
}

.submit-btn{
    padding:15px;
    border:none;
    background:linear-gradient(135deg,#2563eb,#1e3a8a);
    color:white;
    border-radius:40px;
    font-size:16px;
    cursor:pointer;
    transition:0.4s;
}

.submit-btn:hover{
    transform:scale(1.03);
}

footer{
    background:#1e3a8a;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:20px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h1{
        font-size:36px;
    }

    .survey-container{
        padding:25px;
    }
}

</style>

</head>

<body>

<header>

<div class="navbar">

<div class="logo">
Society Survey
</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="polls.html">Polls</a></li>

<li><a href="results.html">Results</a></li>

</ul>

</nav>

</div>

</header>

<section class="hero">

<h1>
Society Feedback Survey
</h1>

<p>
Share your feedback to improve society services
</p>

</section>

<section class="survey-container">

<h2>
Resident Survey Form
</h2>

<form>

<label>
Cleanliness Satisfaction
</label>

<select>

<option>Excellent</option>

<option>Good</option>

<option>Average</option>

<option>Poor</option>

</select>

<label>
Security Service Feedback
</label>

<textarea placeholder="Enter your feedback"></textarea>

<label>
Parking Issues
</label>

<div class="checkbox-group">

<input type="checkbox"> Yes

<input type="checkbox"> No

</div>

<label>
Water Supply Feedback
</label>

<textarea placeholder="Enter your feedback"></textarea>

<label>
Maintenance Quality
</label>

<select>

<option>Excellent</option>

<option>Good</option>

<option>Average</option>

<option>Poor</option>

</select>

<label>
Suggestions
</label>

<textarea placeholder="Enter suggestions"></textarea>

<button type="submit" class="submit-btn">

Submit Survey

</button>

</form>

</section>

<footer>

<p>
© 2026 Society Survey & Election Management System
</p>

</footer>

</body>

</html>
