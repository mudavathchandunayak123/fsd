<!DOCTYPE html>
<html>
<head>
    <title>Survey</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

    <h2>Society Survey</h2>

    <form>

        <label>Cleanliness Satisfaction</label>

        <br>

        <input type="radio" name="clean"> Excellent

        <input type="radio" name="clean"> Good

        <input type="radio" name="clean"> Poor

        <br><br>

        <label>Parking Issues</label>

        <br>

        <input type="checkbox"> Lack of Space

        <input type="checkbox"> Unauthorized Parking

        <br><br>

        <label>Water Supply Feedback</label>

        <select>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>

        <label>Suggestions</label>

        <textarea rows="5"></textarea>

        <button type="submit">Submit Survey</button>

    </form>

</div>

</body>
</html>
