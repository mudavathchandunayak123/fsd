<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           GOOGLE FONT
        ========================== */

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        /* =========================
           GLOBAL STYLING
        ========================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(rgba(30,58,138,0.75),
            rgba(37,99,235,0.75)),
            url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1200') center/cover;
            padding:40px 20px;
        }

        /* =========================
           REGISTER CONTAINER
        ========================== */

        .register-container{
            width:100%;
            max-width:500px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:22px;
            padding:40px;
            box-shadow:0 10px 35px rgba(0,0,0,0.2);
            animation:fadeUp 1s ease;
        }

        /* =========================
           TITLE
        ========================== */

        .register-container h1{
            text-align:center;
            color:white;
            margin-bottom:10px;
            font-size:38px;
        }

        .register-container p{
            text-align:center;
            color:#e2e8f0;
            margin-bottom:30px;
            font-size:15px;
        }

        /* =========================
           FORM
        ========================== */

        form{
            display:flex;
            flex-direction:column;
        }

        /* INPUT BOX */

        .input-box{
            margin-bottom:20px;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:15px 20px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.18);
            color:white;
            font-size:15px;
            transition:0.3s;
        }

        .input-box input::placeholder{
            color:#e2e8f0;
        }

        .input-box select{
            color:white;
        }

        .input-box select option{
            color:black;
        }

        .input-box input:focus,
        .input-box select:focus{
            background:rgba(255,255,255,0.25);
            transform:scale(1.02);
        }

        /* =========================
           REGISTER BUTTON
        ========================== */

        .register-btn{
            padding:14px;
            border:none;
            border-radius:12px;
            background:white;
            color:#2563eb;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.4s;
        }

        .register-btn:hover{
            transform:translateY(-4px);
            background:#dbeafe;
        }

        /* =========================
           LINKS
        ========================== */

        .links{
            margin-top:20px;
            text-align:center;
        }

        .links a{
            color:white;
            text-decoration:none;
            font-size:14px;
            transition:0.3s;
        }

        .links a:hover{
            color:#dbeafe;
            text-decoration:underline;
        }

        /* =========================
           ANIMATION
        ========================== */

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(50px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================== */

        @media(max-width:768px){

            .register-container{
                width:90%;
                padding:35px 25px;
            }

            .register-container h1{
                font-size:32px;
            }
        }

        @media(max-width:480px){

            .register-container{
                padding:30px 20px;
            }

            .register-container h1{
                font-size:28px;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         REGISTER CONTAINER
    ========================== -->

    <div class="register-container">

        <h1>
            Resident Registration
        </h1>

        <p>
            Create your account and participate in society elections & surveys
        </p>

        <!-- REGISTER FORM -->

        <form>

            <!-- FULL NAME -->

            <div class="input-box">

                <input type="text"
                placeholder="Full Name"
                required>

            </div>

            <!-- HOUSE NUMBER -->

            <div class="input-box">

                <input type="text"
                placeholder="Flat / House Number"
                required>

            </div>

            <!-- EMAIL -->

            <div class="input-box">

                <input type="email"
                placeholder="Email Address"
                required>

            </div>

            <!-- MOBILE -->

            <div class="input-box">

                <input type="tel"
                placeholder="Mobile Number"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="input-box">

                <input type="password"
                placeholder="Password"
                required>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="input-box">

                <input type="password"
                placeholder="Confirm Password"
                required>

            </div>

            <!-- RESIDENT TYPE -->

            <div class="input-box">

                <select required>

                    <option value="">
                        Resident Type
                    </option>

                    <option>
                        Owner
                    </option>

                    <option>
                        Tenant
                    </option>

                </select>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="register-btn">

                Register Now

            </button>

        </form>

        <!-- LOGIN LINK -->

        <div class="links">

            <a href="login.html">

                Already have an account? Login

            </a>

        </div>

    </div>

</body>

</html>
```
